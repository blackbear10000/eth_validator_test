global
    log stdout local0
    maxconn 4096
    daemon

defaults
    log global
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    # 默认禁用 HTTP 健康检查
    option dontlognull

# Web3Signer 负载均衡
frontend web3signer_frontend
    bind *:9002
    default_backend web3signer_backend
    # 健康检查端点直接返回 OK
    http-request return status 200 content-type text/plain string "OK" if { path /upcheck }

backend web3signer_backend
    balance roundrobin
    # 使用 TCP 模式进行健康检查，避免 HTTP 403 错误
    # 在 mode http 下，如果不设置 option httpchk，HAProxy 会使用 TCP 连接检查
    # 但为了确保，我们明确禁用 HTTP 健康检查
    server web3signer-1 web3signer-1:9000 check port 9000 inter 10s fall 3 rise 2
    server web3signer-2 web3signer-2:9000 check port 9000 inter 10s fall 3 rise 2 backup

