global
    log stdout local0
    maxconn 4096
    daemon

defaults
    log global
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Web3Signer 负载均衡
frontend web3signer_frontend
    bind *:9002
    default_backend web3signer_backend
    # 健康检查端点直接返回 OK
    http-request return status 200 content-type text/plain string "OK" if { path /upcheck }

backend web3signer_backend
    balance roundrobin
    # Web3Signer 的健康检查端点
    option httpchk GET /upcheck
    http-check expect status 200
    # 禁用健康检查的 Host 头验证，避免 403 错误
    http-check send-state
    server web3signer-1 web3signer-1:9000 check inter 10s fall 3 rise 2
    server web3signer-2 web3signer-2:9000 check inter 10s fall 3 rise 2 backup

