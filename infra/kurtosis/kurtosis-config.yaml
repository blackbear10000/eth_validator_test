# Kurtosis Ethereum Package Configuration
# Goal: fast devnet with built-in validators; later you can add external Web3Signer

participants:
  # 1) Geth × Prysm —— 作为归档 + 调试/追踪节点（便于接 Blockscout）
  # 指定兼容的 Geth 版本（支持 --override.genesis 参数）
  # 新版本的 Geth 可能移除了该参数，所以需要指定旧版本
  - el_type: geth
    cl_type: prysm
    vc_type: prysm
    el_image: ethereum/client-go:v1.16.7
    el_extra_params:
      - "--http.api=admin,engine,net,eth,web3,debug,txpool"

  # 2) Reth × Lighthouse —— 常规
  - el_type: reth
    cl_type: lighthouse
    vc_type: lighthouse
    # 不加 geth 专参

  # 3) Erigon × Lighthouse —— 新增，给 Blockscout / 调试用
  - el_type: erigon
    cl_type: lighthouse
    vc_type: lighthouse
    # 如果只想要“全节点”而不是完整 archive，可显式改成 full
    # el_storage_type: "full"     # 默认 erigon 是 archive，比较吃盘

    # 暴露 JSON-RPC 能力，适配 erigon 的参数
    el_extra_params:
      - "--http"                    # 确保 http 开启
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"          # 端口按需要改，不和别的 EL 冲突就行
      - "--http.vhosts=*"
      - "--http.corsdomain=*"
      - "--http.api=eth,net,web3,debug,trace,txpool,erigon,engine,admin"

# ⬆️ 不固定镜像：省略 el_image/cl_image/vc_image，让包使用其测试过的默认镜像组合
# ⬆️ 不加 el_extra_params：避免把 geth 专属参数误用到 reth

network_params:
  # ===== 时间尺度（缩短等待但不跳过）=====
  seconds_per_slot: 4
  eth1_follow_distance: 16

  # ===== 激活队列（更快清队列）=====
  churn_limit_quotient: 32
  max_per_epoch_activation_churn_limit: 64
  min_validator_withdrawability_delay: 2

  # ===== 创世与验证者基数 =====
  num_validator_keys_per_node: 128
  withdrawal_type: "0x01"

  # ===== 预设与网络标识 =====
  preset: mainnet
  network_id: "3151908"
  deposit_contract_address: "0x4242424242424242424242424242424242424242"

  # ===== Fork 配置 =====
  altair_fork_epoch: 0
  bellatrix_fork_epoch: 0
  capella_fork_epoch: 0
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  fulu_fork_epoch: 18446744073709551615

  # ===== 资金准备（用于后续批量 deposit 测试）=====
  prefunded_accounts: '{
    "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266": {"balance":"10000ETH"}
  }'

  # 给 EL 充足时间就绪，避免 CL 先行导致初始化失败
  genesis_delay: 60


wait_for_finalization: false
global_log_level: info
mev_type: null

additional_services:
  - prometheus_grafana
  - forkmon
  - dora  
  - blockscout

blockscout_params:
  image: "ghcr.io/blockscout/blockscout:latest"
  verif_image: "ghcr.io/blockscout/smart-contract-verifier:latest"
  frontend_image: "ghcr.io/blockscout/frontend:latest"
  env:
    SMART_CONTRACT_VERIFIER__SOLIDITY__FETCHER__LIST__LIST_URL: "https://raw.githubusercontent.com/blockscout/solc-bin/main/list.json"
    # SMART_CONTRACT_VERIFIER__ZKSYNC_SOLIDITY__ENABLED: false
